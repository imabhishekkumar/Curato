# Version catalog — the single place any dependency version is declared.
#
# This matrix was resolved against a real build rather than copied from a compatibility
# table; see "Client toolchain" in DECISIONS.md for what that settled and why.

[versions]
kotlin = "2.4.21"
# Deliberately one minor behind the current stable 9.5.0, which builds fine but which no
# released Android Studio can sync yet. See "Client toolchain" in DECISIONS.md.
agp = "9.3.0"
compose-multiplatform = "1.12.2"

androidx-activity-compose = "1.13.0"
androidx-compose-ui = "1.12.1"
androidx-core-splashscreen = "1.2.0"
androidx-datastore = "1.3.0"
coil = "3.6.3"
koin = "4.2.2"
ktor = "3.6.1"
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.8.0"
kotlinx-serialization = "1.12.0"
navigation-compose = "2.10.0"
lifecycle-viewmodel = "2.11.0"
turbine = "1.2.1"

android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"

[libraries]
# --- Compose / UI ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
compose-ui-android = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose-ui" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel" }
lifecycle-viewmodel-savedstate = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle-viewmodel" }

# --- Images ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# --- DI ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Networking ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Storage ---
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }

# --- Kotlin stdlib-adjacent ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# The client's one formatted date: the enquiry thank-you stamp. The backend sends
# `acceptedAt` as a UTC instant and the stdlib has no time zone database, so rendering it
# in the customer's own clock needs this. On Android it resolves the `jvm` variant and
# reads `java.time`, available natively from API 26 — exactly this project's minSdk, so no
# core-library desugaring is required.
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
