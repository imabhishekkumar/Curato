# The Gradle daemon runs on JDK 21, not whatever happens to be on PATH.
#
# AGP does not support JDK 26, which is the default on at least one machine this is
# built on, so leaving the daemon JVM implicit makes the build depend on a shell
# variable. Written as a version criterion rather than a path, so it stays portable:
# Gradle resolves it against locally installed JDKs.
toolchainVersion=21
