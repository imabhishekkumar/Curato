org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Where the debug build looks for the backend.
#
# `localhost` rather than the emulator's 10.0.2.2 host alias, because it needs a port
# forward that works on every target rather than an address that works on some:
#
#   adb reverse tcp:8080 tcp:8080     (./scripts/dev.sh does this for every attached device)
#
# 10.0.2.2 is emulator-only and silently unreachable on some images — on the Pixel 10 API
# 37 emulator here, the system browser reaches it while an app's socket times out after
# 10s, which reads as "the backend is down" when it is plainly running. `adb reverse`
# tunnels over the adb connection, sidestepping the emulator's NAT, and is also the only
# one of the two that works on a physical device.
#
# Set here rather than passed as -P so Android Studio's Run button produces the same
# build as the command line. Override per-invocation with
# `-Pcurato.apiBaseUrl=…` when pointing at a deployed backend.
curato.apiBaseUrl=http://localhost:8080
